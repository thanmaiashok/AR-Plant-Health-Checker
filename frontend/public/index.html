<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Plant Health Monitor</title>
    <link rel="stylesheet" href="../src/styles/main.css">

</head>

<body>

    <div id="header-container">
        <img id="app-logo" src="../src/assets/images/logo.png" alt="Plant Health Monitor Logo"
            onerror="this.style.display='none'">
        <h1>Plant Health Monitor</h1>
    </div>

    <div id="camera-container">

        <video id="camera" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
        <canvas id="overlay3d"></canvas>

    </div>

    <div id="controls">
        <button id="analyzeBtn">Analyze Plant</button>

        <label id="autoscan">
            <input type="checkbox" id="autoScanToggle" />
            <span>Auto-scan (1s)</span>
        </label>

        <button id="snapshotBtn" disabled>Save Snapshot</button>
    </div>

    <div id="status">AR Ready</div>

    <div id="result">

        Plant health status will appear here

    </div>

    <div id="history">
        <h3>Scan History</h3>
        <div id="historyList">No scans yet</div>
    </div>

    <script type="module" src="../src/app.js"></script>

</body>

</html>
