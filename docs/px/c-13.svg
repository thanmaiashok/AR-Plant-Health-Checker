onospace">|-- backend/</text><text x="24.00" y="106" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- api/            </text><text x="244.80" y="106" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Flask server + routes</text><text x="24.00" y="132" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- inference/      </text><text x="244.80" y="132" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Predict + leaf detection</text><text x="24.00" y="158" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- models/         </text><text x="244.80" y="158" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Trained .keras model + class indices</text><text x="24.00" y="184" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- training/       </text><text x="244.80" y="184" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Preprocessing, training, evaluation scripts</text><text x="24.00" y="210" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- utils/          </text><text x="244.80" y="210" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Image utils + recommendation engine</text><text x="24.00" y="236" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   `-- requirements.txt</text><text x="24.00" y="262" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- frontend/</text><text x="24.00" y="288" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- public/         </text><text x="244.80" y="288" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># index.html, favicon</text><text x="24.00" y="314" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   `-- src/</text><text x="24.00" y="340" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|       |-- ar/         </text><text x="244.80" y="340" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># arCamera, arOverlay, ar3dOverlay</text><text x="24.00" y="366" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|       |-- components/ </text><text x="244.80" y="366" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># ResultPanel, HealthIndicator</text><text x="24.00" y="392" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|       `-- services/   </text><text x="244.80" y="392" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># imageUpload, apiService</text><text x="24.00" y="418" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- docs/               </text><text x="244.80" y="418" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Architecture diagram + reports</text><text x="24.00" y="444" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- start.sh / start.bat</text><text x="24.00" y="470" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">`-- kill.sh  / kill.bat</text><g id="vines"><rect x="6" y="0" width="6" height="6" fill="#4a7a3c"/><rect x="48" y="0" width="6" height="6" fill="#2f5229"/><rect x="372" y="0" width="6" height="6" fill="#2f5229"/><rect x="468" y="0" width="6" height="6" fill="#2f5229"/><rect x="516" y="0" width="6" height="6" fill="#4a7a3c"/><rect x="606" y="0" width="6" height="6" fill="#2f5229"/><rect x="624" y="0" width="6" height="6" fill="#2f5229"/><rect x="630" y="0" width="6" height="6" fill="#4a7a3c"/><rect x="642" y="0" width="6" height="6" fill="#4a7a3c"/><rect x="732" y="0" width="6" height="6" fill="#4a7a3c"/><rect x=